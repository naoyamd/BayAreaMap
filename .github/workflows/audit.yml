name: Data audit

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Audit mode
        type: choice
        required: true
        default: daily
        options:
          - daily
          - all

permissions:
  contents: write
  issues: read

concurrency:
  group: data-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect priority correction flags
        id: correction_flags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ids="$(
            gh issue list --state open --limit 100 --json body --jq '.[].body' |
              sed -n 's/^Entity ID: `\([a-z0-9][a-z0-9-]*\)`$/\1/p' |
              sort -u |
              paste -sd, -
          )"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Run priority data audit
        if: steps.correction_flags.outputs.ids != ''
        env:
          PRIORITY_IDS: ${{ steps.correction_flags.outputs.ids }}
        run: node scripts/audit.mjs --ids "$PRIORITY_IDS"

      - name: Run oldest-first data audit
        shell: bash
        run: |
          if [ "${{ inputs.mode }}" = "all" ]; then
            node scripts/audit.mjs --all
          else
            node scripts/audit.mjs
          fi

      - name: Render README
        shell: bash
        run: node scripts/render-readme.mjs

      - name: Test
        shell: bash
        run: npm test

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- data/entities.geojson README.md)" ]; then
            echo "no changes"
          else
            git add data/entities.geojson README.md
            git commit -m "chore: refresh data audit"
            git push
          fi
